[project]
name = "quant-stack"
version = "0.1.0"
description = "Connected market-making research stack: Monte Carlo pricing, a C++ limit order book, and a market maker that trades in it"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Mohammad Naqi Zaidi" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.15",
    "pandas>=2.2",
    "numba>=0.60",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "matplotlib>=3.9",
]

# scikit-build-core builds the C++ order book into the `orderbook` package (Project 2 step 5),
# so `uv sync` compiles it: a C++20 compiler and CMake >= 3.25 are needed.
[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.25"
cmake.build-type = "Release"
wheel.packages = ["mc_engine", "marketdata", "lob/python/orderbook"]
build-dir = "build/py/{wheel_tag}"

[tool.scikit-build.cmake.define]
QS_BUILD_PYTHON = "ON"
QS_BUILD_TESTS = "OFF"
QS_BUILD_TOOLS = "OFF"
QS_BUILD_BENCHMARKS = "OFF"

# Rebuild the module whenever the C++ changes (uv otherwise reuses the last build).
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "lob/CMakeLists.txt" },
    { file = "lob/include/**/*.hpp" },
    { file = "lob/src/**/*.cpp" },
    { file = "lob/python/CMakeLists.txt" },
    { file = "lob/python/*.cpp" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build"]
src = [".", "lob/python"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
