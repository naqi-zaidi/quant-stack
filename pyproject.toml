[project]
name = "quant-stack"
version = "0.1.0"
description = "Connected market-making research stack: Monte Carlo pricing, a C++ limit order book, and a market maker that trades in it"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Mohammad Naqi Zaidi" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.15",
    "pandas>=2.2",
    "numba>=0.60",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mc_engine", "marketdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
