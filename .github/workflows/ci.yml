name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install pinned environment
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest
      - name: Step 1 gate (Monte Carlo vs Black–Scholes)
        run: uv run python -m mc_engine.experiments.bs_gate
      - name: Step 2 gate (variance-reduced error bars are calibrated)
        run: uv run python -m mc_engine.experiments.variance_reduction --no-figure
      - name: Step 3 gate (Greeks match Black–Scholes)
        run: uv run python -m mc_engine.experiments.greeks --no-figure
      - name: Step 4 gate (Asian, barrier, American vs references)
        run: uv run python -m mc_engine.experiments.path_dependent --no-figure
      - name: Step 5 gate (Merton, Heston benchmarks and smile)
        run: uv run python -m mc_engine.experiments.models --no-figure
      - name: Step 6 gate (Heston calibration to SPY, parameter recovery)
        run: uv run python -m mc_engine.experiments.calibration --no-figure
      - name: Step 7 gate (Numba kernels correct; throughput printed for this runner)
        run: uv run python -m mc_engine.experiments.speed

  cpp:
    name: C++ (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, release]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j 4
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Phase 2 step 2 gate (order book holds every property; every planted bug caught)
        if: matrix.preset == 'release'
        run: ./build/release/lob/tests/lob_property_report
      - name: Phase 2 step 4 gate (steady state allocation-free on the array book; map allocates only per new level)
        if: matrix.preset == 'release'
        run: ./build/release/lob/tests/lob_alloc_check
      - name: Phase 2 step 4 smoke (benchmarks build and run; timings are machine-specific)
        if: matrix.preset == 'release'
        run: ./build/release/lob/lob_bench --benchmark_min_time=0.01s
